<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRO Khang Nam - B2B Industrial Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kn-blue': '#00479b',
                        'kn-orange': '#ff5e00',
                        'kn-light': '#f5f6f8',
                        'kn-dark': '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        kr: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-kn-light text-kn-dark font-sans antialiased">

    <!-- CHỖ NÀY ĐỂ RÁP HEADER BẰNG JAVASCRIPT -->
    <div id="app-header"></div>

    <!-- 3. HERO SECTION -->
    <section class="bg-white border-b border-gray-200 relative z-10">
        <div class="container mx-auto px-4 py-12 flex flex-col md:flex-row items-center">
            <div class="md:w-1/2 mb-8 md:mb-0 pr-0 md:pr-8">
                <h2 class="text-4xl lg:text-5xl font-bold text-kn-blue mb-4 leading-tight uppercase">
                    Một nhà cung cấp đáp ứng<br><span class="text-kn-orange">mọi nhu cầu công nghiệp</span>
                </h2>
                <p class="text-xl text-gray-500 mb-6 font-medium">Vật tư và giải pháp bảo trì, sửa chữa công nghiệp</p>
                <ul class="space-y-3 mb-8 text-kn-dark font-medium text-lg">
                </ul>
                <a href="pages/rfq.html" class="inline-block bg-kn-orange text-white px-8 py-3 rounded text-lg font-bold hover:bg-orange-600 transition-colors shadow-lg">
                    Yêu cầu báo giá
                </a>
            </div>
            <div class="md:w-1/2 w-full">
                <!-- Xóa cụm thẻ div bg-gray-200 cũ đi và dán đè đoạn này vào -->
                <div class="w-full h-80 md:h-96 rounded-xl overflow-hidden shadow-xl border border-gray-100">
                    <img src="assets/anh.png" alt="MRO Khang Nam Hero" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                </div>
            </div>
        </div>
    </section>

    <!-- 4. MAIN CATEGORIES -->
    <section class="bg-kn-light py-16 relative z-10">
        <div class="container mx-auto px-4">
        <div class="text-center mb-10">
            <h3 class="text-3xl font-bold text-kn-blue uppercase inline-block">Tất cả danh mục chính</h3>
            <div class="w-24 h-1 bg-kn-orange mx-auto mt-4"></div>
        </div>
            <div id="categoryGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            
            <div class="col-span-full flex justify-center items-center py-10">
                <svg class="animate-spin h-8 w-8 text-kn-orange mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" class="opacity-25"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-gray-500 font-bold">Đang tải danh mục...</span>
            </div>
            </div>
        </div>
    </section>

    <!-- 5. FEATURED BRANDS (HIỆU ỨNG CUỘN VÔ TẬN) -->
    <section class="bg-kn-blue py-10 overflow-hidden">
    <div class="container mx-auto px-4">
        <div class="flex flex-col md:flex-row items-center justify-between">
            
            <div class="mb-6 md:mb-0 md:w-1/4 z-10 shrink-0 relative bg-kn-blue pr-4">
                <h3 class="text-2xl font-bold text-white uppercase border-l-4 border-kn-orange pl-4">
                    Thương hiệu<br>Nổi bật
                </h3>
            </div>

            <style>
                .mask-image {
                    -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
                    mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
                }
                /* Ẩn thanh cuộn nhưng vẫn cho cuộn mượt mà */
                .no-scrollbar::-webkit-scrollbar {
                    display: none;
                }
                .no-scrollbar {
                    -ms-overflow-style: none;
                    scrollbar-width: none;
                }
                /* Đổi icon con chuột thành bàn tay nắm lại */
                .cursor-grab { cursor: grab; }
                .cursor-grabbing { cursor: grabbing !important; }
            </style>

            <div id="brandScrollContainer" class="md:w-3/4 w-full relative overflow-x-auto no-scrollbar flex items-center mask-image cursor-grab">
                <div class="w-full text-center text-blue-300 font-bold text-sm py-2">
                    Đang tải thương hiệu...
                </div>
            </div>
        </div>
    </div>
    </section>

    <!-- 6. FEATURED PRODUCTS -->
    <section class="py-16 bg-white">
    <div class="container mx-auto px-4">
        <div class="mb-10">
            <h3 class="text-3xl font-bold text-kn-blue uppercase">Sản phẩm bán chạy</h3>
            <p class="text-gray-500 mt-2 font-medium">Top Industrial Products</p>
        </div>
        
        <div id="bestSellingGrid" class="w-full relative overflow-x-auto no-scrollbar flex items-stretch mask-image py-4 cursor-grab">
            <div class="w-full flex justify-center py-10">
                <svg class="animate-spin h-8 w-8 text-kn-orange mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" class="opacity-25"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-gray-500 font-bold">Đang tải sản phẩm hot...</span>
            </div>
        </div>
    </div>
    </section>

    <!-- CHỖ NÀY ĐỂ RÁP FOOTER BẰNG JAVASCRIPT -->
    <div id="app-footer"></div>

    
    <!-- 1. GỌI SCRIPT COMPONENT HEADER/FOOTER -->
    <script src="assets/components/header.js"></script>
    <script src="assets/components/footer.js"></script>

    <!-- 2. GỌI THƯ VIỆN & SCRIPT DÙNG CHUNG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/common.js"></script>

    <!-- 3. SCRIPT LOGIC RIÊNG CỦA TRANG NÀY (CỰC SẠCH) -->
    <script src="assets/js/index.js"></script>
</body>
</html>
