<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang đăng xuất... - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
</head>
<body class="bg-gray-900 h-screen flex flex-col items-center justify-center text-white overflow-hidden">

    <!-- Logo Admin -->
    <div class="mb-10 transform scale-125">
        <span class="text-4xl font-black tracking-wider text-white flex items-center">
            KN <span class="text-kn-orange ml-2">ADMIN</span>
        </span>
    </div>

    <!-- Hiệu ứng Spinner Loading xoay vòng -->
    <div class="relative w-16 h-16 mb-6">
        <!-- Vòng mờ phía sau -->
        <div class="absolute inset-0 border-4 border-gray-700 rounded-full"></div>
        <!-- Vòng cam chạy phía trước -->
        <div class="absolute inset-0 border-4 border-kn-orange rounded-full border-t-transparent animate-spin"></div>
    </div>

    <!-- Thông báo -->
    <h2 class="text-xl font-medium text-gray-300">Đang đăng xuất khỏi hệ thống...</h2>
    <p class="text-sm text-gray-500 mt-2">Vui lòng đợi trong giây lát, hệ thống đang làm sạch dữ liệu phiên làm việc.</p>

    <!-- 1. GỌI LẠI ĐÚNG FILE CẤU HÌNH DÙNG CHUNG CỦA ADMIN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common/supabase.js"></script>
    
    <script>
        async function doLogout() {
            try {
                // 2. Dùng đúng client có chứa cấu hình storageKey của Admin
                if (window.supabaseClient) {
                    await window.supabaseClient.auth.signOut();
                }
            } catch (error) {
                console.error("Lỗi đăng xuất:", error);
            } finally {
                // 3. Đợi 1.5 giây rồi đá về ĐÚNG TRANG LOGIN CỦA ADMIN (cùng cấp thư mục)
                setTimeout(function() {
                    window.location.replace("login.html");
                }, 1500);
            }
        }

        doLogout();
    </script>
</body>
</html>
