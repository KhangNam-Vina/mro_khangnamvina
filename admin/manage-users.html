<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - KN Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00' } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden relative">

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-none"></div>

    <aside
    id="adminSidebar"
    class="
        w-64
        bg-gray-900
        text-white
        flex
        flex-col
        hidden
        md:flex
        shrink-0
    "
></aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow-sm px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200">
            <div>
                <h2 class="text-xl font-bold text-gray-900">Quản lý Người dùng</h2>
                <p class="text-xs text-gray-500 mt-1">Quản lý tài khoản nhân viên nội bộ và hồ sơ khách hàng</p>
            </div>
            
            <div class="flex space-x-3 w-full md:w-auto mt-3 md:mt-0">
                <div class="flex items-center space-x-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 focus-within:border-kn-blue transition flex-1 md:flex-none w-full md:w-64">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" placeholder="Tìm email, sđt..." class="bg-transparent border-none outline-none text-sm text-gray-700 w-full">
                </div>
                <!-- Nút chỉ hiện bên Tab Nhân viên -->
                <button id="btnAddStaff" onclick="showUserModal()" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition flex items-center whitespace-nowrap">
                    <span class="mr-2 text-lg leading-none">+</span> Cấp quyền mới
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            
            <!-- TABS ĐIỀU HƯỚNG -->
            <div class="flex space-x-4 mb-4 border-b border-gray-200">
                <button onclick="switchTab('staff')" id="btnTabStaff" class="pb-3 px-2 font-bold text-sm text-gray-900 border-b-2 border-gray-900 transition">Nhân viên Nội bộ</button>
                <button onclick="switchTab('customer')" id="btnTabCustomer" class="pb-3 px-2 font-bold text-sm text-gray-500 hover:text-gray-800 transition border-b-2 border-transparent">Khách hàng Đăng ký</button>
            </div>

            <!-- BẢNG DANH SÁCH -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-6">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 font-bold border-b border-gray-200 text-xs uppercase tracking-wider">
                        <tr id="tableHeader">
                            <!-- JS Sẽ đổ Header tương ứng vào đây -->
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-100 bg-white">
                        <tr><td colspan="6" class="text-center py-8 text-gray-400">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="paginationContainer" class="flex justify-between items-center text-sm py-2"></div>
        </main>
    </div>

    <!-- MODAL FORM CẤP QUYỀN (Dành cho Nhân viên) -->
    <div id="userModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity">
        <div class="bg-white rounded-xl w-full max-w-md shadow-2xl overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-900">Cấp quyền Tài khoản</h3>
                <button onclick="closeUserModal()" class="text-gray-400 hover:text-red-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="userForm" class="p-6 space-y-5">
                <input type="hidden" id="inUserId"> 
                <div class="bg-blue-50 text-blue-800 p-3 rounded-md text-xs mb-4">
                    <strong>Lưu ý:</strong> Người dùng cần tạo tài khoản trên web trước. Sau đó bạn nhập Email của họ vào đây để cấp quyền Quản trị.
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Email Tài Khoản <span class="text-red-500">*</span></label>
                    <input type="email" id="inUserEmail" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="VD: nhanvien@khangnam.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Phân Quyền (Role) <span class="text-red-500">*</span></label>
                    <select id="inUserRole" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue bg-white">
                        <option value="admin">Admin (Toàn quyền)</option>
                        <option value="editor">Editor (Đăng bài, Cập nhật SP)</option>
                        <option value="sales">Sales (Xử lý đơn Báo giá)</option>
                    </select>
                </div>
            </form>

            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3 bg-gray-50/50">
                <button onclick="closeUserModal()" class="px-5 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-700 hover:bg-gray-100 transition">Hủy</button>
                <button onclick="saveUser()" id="btnSaveUser" class="px-6 py-2 bg-gray-900 text-white rounded-lg text-sm font-bold hover:bg-black transition shadow-sm">Lưu Quyền</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/admin/admin-core.js"></script> 
    <script src="../assets/js/admin/admin-nav.js"></script>
    <script src="../assets/js/admin/admin-users.js"></script>
</body>
</html>
