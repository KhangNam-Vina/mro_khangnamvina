<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình Website - KN Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00' } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">

    <aside
    id="adminSidebar"
    class="
        w-64
        bg-gray-900
        text-white
        flex
        flex-col
        hidden
        md:flex
        shrink-0
    "
></aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow-sm px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200">
            <div>
                <h2 class="text-xl font-bold text-gray-900">Cấu hình Website</h2>
                <p class="text-xs text-gray-500 mt-1">Cập nhật thông tin công ty, liên hệ và SEO cho toàn hệ thống</p>
            </div>
            <div class="mt-3 md:mt-0">
                <button onclick="saveSettings()" id="btnSaveSettings" class="bg-gray-900 hover:bg-black text-white px-6 py-2 rounded-lg text-sm font-bold shadow transition flex items-center">
                    Lưu cấu hình
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            <form id="settingsForm" class="max-w-5xl mx-auto space-y-6 pb-10">
                
                <!-- KHỐI 1: THÔNG TIN CHUNG -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <h3 class="font-bold text-gray-900 border-b border-gray-100 pb-3 mb-5 uppercase text-sm tracking-wider">Thông tin chung</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Tên Công Ty / Thương Hiệu</label>
                            <input type="text" id="inCompanyName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Link Logo (URL)</label>
                            <input type="text" id="inLogoUrl" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="https://...">
                        </div>
                    </div>
                </div>

                <!-- KHỐI 2: LIÊN HỆ & BẢN ĐỒ -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <h3 class="font-bold text-gray-900 border-b border-gray-100 pb-3 mb-5 uppercase text-sm tracking-wider">Thông tin liên lạc</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Hotline</label>
                            <input type="text" id="inHotline" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="VD: 0909.xxx.xxx">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Email hỗ trợ</label>
                            <input type="email" id="inEmail" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Zalo / Viber</label>
                            <input type="text" id="inZalo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Thời gian làm việc</label>
                            <input type="text" id="inWorkingHours" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="VD: Thứ 2 - Thứ 7 | 8:00 - 17:00">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Địa chỉ văn phòng / Kho bãi</label>
                            <textarea id="inAddress" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- KHỐI 3: SOCIAL & SEO -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- SOCIAL -->
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-900 border-b border-gray-100 pb-3 mb-5 uppercase text-sm tracking-wider">Mạng Xã Hội</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Facebook Page (URL)</label>
                                <input type="url" id="inFacebook" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="https://facebook.com/...">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">YouTube Channel (URL)</label>
                                <input type="url" id="inYoutube" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="https://youtube.com/...">
                            </div>
                        </div>
                    </div>

                    <!-- SEO -->
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-900 border-b border-gray-100 pb-3 mb-5 uppercase text-sm tracking-wider">SEO Mặc định trang chủ</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Meta Title</label>
                                <input type="text" id="inMetaTitle" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Meta Description</label>
                                <textarea id="inMetaDesc" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue resize-none" placeholder="Mô tả tóm tắt doanh nghiệp để Google hiển thị..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

            </form>
        </main>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-none"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/admin/admin-core.js"></script> 
    <script src="../assets/js/admin/admin-nav.js"></script>
    <script src="../assets/js/admin/admin-settings.js"></script>
</body>
</html>
