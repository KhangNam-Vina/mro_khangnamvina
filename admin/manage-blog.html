<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Blog - MRO Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ckeditor.com/4.20.0/standard/ckeditor.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

   <!-- SIDEBAR CHUẨN MỰC -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex shrink-0">
        <div class="h-16 flex items-center px-6 bg-gray-950 border-b border-gray-800">
            <span class="text-xl font-black tracking-wider text-white">Khangnam <span class="text-kn-orange">ADMIN</span></span>
        </div>

        <div class="flex-1 overflow-y-auto py-4">
            <nav class="space-y-1 px-3">
                <!-- 1. Tổng quan -->
                <a href="dashboard.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Tổng quan
                </a>
                <!-- 2. Quản lý báo giá -->
                <a href="rfq-detail.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Quản lý báo giá 
                </a>
                <!-- 3. Quản lý sản phẩm -->
                <a href="manage-products.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Quản lý sản phẩm
                </a>
                <!-- 5. Quản lý ngành hàng -->
                <a href="manage-industries.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Quản lý ngành hàng
                </a>
                <a href="manage-families.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                   Quản lý dòng sản phẩm
                </a>
                <!-- 6. Quản lý trang blog -->
                <a href="manage-blog.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    Quản lý trang blog
                </a>
                <!-- 7. Quản lý liên hệ -->
                <a href="manage-contacts.html" class="flex items-center px-3 py-2.5 bg-gray-800 text-white rounded-md group">
                    <svg class="w-5 h-5 mr-3 text-kn-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Quản lý liên hệ
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-gray-800">
            <a href="../admin/login.html" class="flex items-center text-sm text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Đăng xuất
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
        <div class="mb-6 flex items-center justify-between">
            <h2 class="text-2xl font-bold text-gray-800">Quản lý Blog & Tin tức</h2>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

            <!-- CỘT TRÁI: FORM VIẾT BÀI -->
            <div class="xl:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <form id="blogForm" onsubmit="saveBlog(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Tiêu đề bài viết *</label>
                            <input type="text" id="inTitle" required class="w-full px-3 py-2 border border-gray-300 rounded focus:border-kn-blue outline-none" placeholder="Nhập tiêu đề...">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Đường dẫn (Slug) *</label>
                            <input type="text" id="inSlug" required class="w-full px-3 py-2 border border-gray-300 rounded focus:border-kn-blue outline-none bg-gray-50 text-gray-600" placeholder="duong-dan-bai-viet">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Link Ảnh Thumbnail (URL) *</label>
                            <input type="url" id="inThumbnail" required class="w-full px-3 py-2 border border-gray-300 rounded focus:border-kn-blue outline-none" placeholder="https://...">
                            <!-- Khung Preview Ảnh Mới Thêm -->
                            <div class="mt-2">
                                <img id="thumbnailPreview" src="" class="hidden h-24 object-cover rounded shadow-sm border border-gray-200">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Nội dung bài viết *</label>
                            <textarea id="inContent" name="inContent" required></textarea>
                        </div>
                        <div class="pt-2 flex items-center space-x-3">
                            <button type="submit" id="btnSaveBlog" class="bg-kn-blue hover:bg-blue-800 text-white font-bold py-2.5 px-6 rounded shadow transition">Lưu Bài Viết</button>
                            <button type="button" id="btnCancelEdit" onclick="cancelEdit()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-6 rounded transition">Hủy sửa</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- CỘT PHẢI: DANH SÁCH BÀI VIẾT -->
            <div class="xl:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b border-gray-200">
                        <h3 class="font-bold text-gray-800 text-sm uppercase">Danh sách bài đã đăng</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead class="bg-gray-100 text-gray-700 font-bold border-b text-xs uppercase">
                                <tr>
                                    <th class="p-3 text-center w-12">#</th>
                                    <th class="p-3 w-20">Ảnh</th>
                                    <th class="p-3">Bài viết</th>
                                    <th class="p-3 w-24">Ngày đăng</th>
                                    <th class="p-3 text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="blogTableBody" class="divide-y divide-gray-100">
                                <!-- Data Bơm từ JS -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Phân trang -->
                    <div id="paginationContainer" class="p-4 flex justify-center space-x-2 border-t border-gray-100 bg-gray-50"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Khởi tạo CKEditor -->
    <script>
        CKEDITOR.replace('inContent', {
            height: 300,
            toolbar: [
                { name: 'document', items: ['Source'] },
                { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike'] },
                { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Blockquote'] },
                { name: 'links', items: ['Link', 'Unlink'] },
                { name: 'insert', items: ['Image', 'Table', 'HorizontalRule'] },
                { name: 'styles', items: ['Format', 'Font', 'FontSize'] },
                { name: 'colors', items: ['TextColor', 'BGColor'] }
            ]
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/services/blogService.js"></script>
    <script src="../assets/js/admin/admin-blog.js"></script>
</body>
</html>
