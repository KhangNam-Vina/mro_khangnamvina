<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Blog - KN Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00' } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden relative">

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-none"></div>

   <aside
    id="adminSidebar"
    class="
        w-64
        shrink-0
        bg-gray-900
        text-white
        hidden
        md:flex
        flex-col
        sticky
        top-0
        h-screen
        self-start
    "
></aside>
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow-sm px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200">
            <div>
                <h2 class="text-xl font-bold text-gray-900">Quản lý Bài viết Blog</h2>
                <p class="text-xs text-gray-500 mt-1">Tin tức kỹ thuật, hướng dẫn chọn vật tư & tài liệu MRO</p>
            </div>
            <button onclick="showCreateBlogForm()" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition flex items-center mt-3 md:mt-0">
                <span class="mr-2 text-lg leading-none">+</span> Viết bài mới
            </button>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            
            <div id="blogListView">
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-4">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 font-bold border-b border-gray-200 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="p-4 text-center w-12">#</th>
                                <th class="p-4 w-20">Ảnh</th>
                                <th class="p-4">Tiêu đề & Danh mục</th>
                                <th class="p-4 w-28 text-center whitespace-nowrap">Trạng thái</th>
                                <th class="p-4 w-32 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="blogTableBody" class="divide-y divide-gray-100 bg-white">
                            <tr><td colspan="5" class="text-center py-8 text-gray-400">Đang tải danh sách bài viết...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationContainer" class="flex justify-between items-center text-sm py-2"></div>
            </div>

            <div id="blogFormView" class="hidden bg-white rounded-xl border border-gray-200 shadow-sm p-6 max-w-5xl mx-auto mb-10">
                <div class="flex justify-between items-center border-b pb-4 mb-6 border-gray-100">
                    <h3 id="formTitle" class="text-lg font-bold text-gray-900">Viết Bài Mới</h3>
                    <button type="button" onclick="cancelEdit()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕ Đóng</button>
                </div>

                <form id="blogForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Tiêu đề bài viết <span class="text-red-500">*</span></label>
                            <input type="text" id="inTitle" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="Nhập tiêu đề...">
                        </div>
                        
                        <!-- BỔ SUNG: Ô TÓM TẮT BỊ THIẾU -->
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Tóm tắt bài viết (Summary) <span class="text-red-500">*</span></label>
                            <textarea id="inSummary" rows="3" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue resize-none" placeholder="Đoạn mô tả ngắn hiển thị ở trang chủ Blog..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Đường dẫn (Slug) <span class="text-red-500">*</span></label>
                            <input type="text" id="inSlug" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue bg-gray-50" placeholder="duong-dan-bai-viet">
                        </div>

                        <!-- BỔ SUNG: CHỌN DANH MỤC -->
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Phân loại danh mục</label>
                            <select id="inCategory" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue">
                                <option value="ALL">Khác (Chung)</option>
                                <option value="bảo trì">Bảo trì</option>
                                <option value="vật tư">Vật tư</option>
                                <option value="an toàn">An toàn (Safety)</option>
                            </select>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Link Ảnh Thumbnail (URL) <span class="text-red-500">*</span></label>
                            <div class="flex items-start space-x-3">
                                <input type="url" id="inThumbnail" required class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-kn-blue" placeholder="https://...">
                                <img id="thumbnailPreview" class="hidden w-16 h-10 object-cover rounded-md shadow-sm border border-gray-200">
                            </div>
                        </div>

                        <!-- BỔ SUNG: ẨN HIỆN -->
                        <div class="md:col-span-2 flex items-center pt-2 pb-2">
                            <input type="checkbox" id="inActive" class="w-4 h-4 text-kn-blue border-gray-300 rounded focus:ring-kn-blue cursor-pointer" checked>
                            <label for="inActive" class="ml-2 text-sm font-bold text-gray-700 cursor-pointer">Cho phép hiển thị trên Website (is_active)</label>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Nội dung bài viết <span class="text-red-500">*</span></label>
                            <textarea id="inContent" name="inContent" required></textarea>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-100 flex justify-end space-x-3">
                        <button type="button" onclick="cancelEdit()" class="px-5 py-2 border border-gray-300 text-gray-700 rounded-lg font-bold text-sm hover:bg-gray-50 transition">Hủy Bỏ</button>
                        <button type="button" onclick="saveBlog(event)" id="btnSaveBlog" class="px-6 py-2 bg-gray-900 text-white rounded-lg font-bold text-sm hover:bg-black transition shadow">Lưu Bài Viết</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <!-- KHỞI TẠO CKEDITOR -->
    <script>
        CKEDITOR.replace('inContent', {
            height: 400,
            toolbar: [
                { name: 'document', items: ['Source'] },
                { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike'] },
                { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Blockquote', 'JustifyLeft', 'JustifyCenter', 'JustifyRight'] },
                { name: 'links', items: ['Link', 'Unlink'] },
                { name: 'insert', items: ['Image', 'Table', 'HorizontalRule'] },
                { name: 'styles', items: ['Format', 'Font', 'FontSize'] },
                { name: 'colors', items: ['TextColor', 'BGColor'] }
            ]
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/admin/admin-core.js"></script>
    <script src="../assets/js/admin/admin-nav.js"></script>
    <script src="../assets/js/services/blogService.js"></script>
    <script src="../assets/js/admin/admin-blog.js"></script>
</body>
</html>
