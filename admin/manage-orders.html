<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Đơn hàng - KN Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{'kn-blue':'#00479b','kn-orange':'#ff5e00'}}}}
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">

<aside
    id="adminSidebar"
    class="w-64 shrink-0 bg-gray-900 text-white hidden md:flex flex-col sticky top-0 h-screen self-start"
></aside>

<div class="flex-1 flex flex-col h-screen overflow-hidden">
<header class="bg-white shadow-sm px-6 py-4 border-b border-gray-200 z-10 sticky top-0">
  <div class="flex flex-wrap gap-4 justify-between items-center">
    <div>
      <h1 class="text-xl font-black text-gray-900">Quản lý Đơn hàng</h1>
      <p class="text-xs text-gray-500 mt-1">Theo dõi và xử lý các đơn hàng từ khách hàng.</p>
    </div>
    
    <div class="flex items-center gap-3">
        <!-- BỘ LỌC THỜI GIAN TOÀN CỤC (MỚI THÊM) -->
        <select id="globalTimeFilter" class="bg-blue-50 border border-blue-200 text-kn-blue rounded-lg px-4 py-2.5 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-200 shadow-sm cursor-pointer transition hover:bg-blue-100">
            <option value="this_month">Tháng này</option>
            <option value="last_month">Tháng trước</option>
            <option value="7_days">7 ngày qua</option>
            <option value="today">Hôm nay</option>
            <option value="all">Tất cả thời gian</option>
        </select>

        <!-- NÚT LÀM MỚI -->
        <button id="btnRefreshOrders" type="button" class="px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-700 hover:bg-gray-50 transition shadow-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span class="hidden sm:inline">Làm mới</span>
        </button>
    </div>
  </div>
</header>

<main class="flex-1 overflow-y-auto bg-gray-50 p-6">
<div class="max-w-[1600px] mx-auto space-y-5">

<section class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3">
  <!-- Tổng đơn -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-black whitespace-nowrap">Tổng đơn</p>
    <p id="kpiTotal" class="text-2xl font-black mt-1">0</p>
  </div>
  
  <!-- Chờ xử lý -->
  <div class="bg-white rounded-xl border border-orange-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-orange-500 font-black whitespace-nowrap">Chờ xử lý</p>
    <p id="kpiPending" class="text-2xl font-black text-orange-600 mt-1">0</p>
  </div>

  <!-- Đã xác nhận -->
  <div class="bg-white rounded-xl border border-blue-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-blue-500 font-black whitespace-nowrap">Đã xác nhận</p>
    <p id="kpiConfirmed" class="text-2xl font-black text-blue-600 mt-1">0</p>
  </div>
  
  <!-- Đang xử lý -->
  <div class="bg-white rounded-xl border border-purple-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-purple-500 font-black whitespace-nowrap">Đang xử lý</p>
    <p id="kpiProcessing" class="text-2xl font-black text-purple-600 mt-1">0</p>
  </div>

  <!-- Đang giao -->
  <div class="bg-white rounded-xl border border-indigo-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-indigo-500 font-black whitespace-nowrap">Đang giao</p>
    <p id="kpiShipped" class="text-2xl font-black text-indigo-600 mt-1">0</p>
  </div>
  
  <!-- Đã giao -->
  <div class="bg-white rounded-xl border border-green-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-green-500 font-black whitespace-nowrap">Đã giao</p>
    <p id="kpiDelivered" class="text-2xl font-black text-green-600 mt-1">0</p>
  </div>

  <!-- Đã hủy -->
  <div class="bg-white rounded-xl border border-red-200 shadow-sm p-4">
    <p class="text-[10px] uppercase tracking-wider text-red-500 font-black whitespace-nowrap">Đã hủy</p>
    <p id="kpiCancelled" class="text-2xl font-black text-red-600 mt-1">0</p>
  </div>
</section>

<section class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
  
  <!-- BỘ LỌC ĐƯỢC CHUYỂN XUỐNG DƯỚI -->
  <div class="px-6 py-4 border-b border-gray-200 flex flex-wrap justify-between items-center gap-4 bg-gray-50/50">
    <div>
        <h2 class="font-black text-gray-900">Danh sách đơn hàng</h2>
        <p class="text-xs text-gray-500 mt-1">Nhấn "Xem đơn" để mở chi tiết.</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-3">
        <!-- Ô TÌM KIẾM -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input id="searchOrderInput" type="text" placeholder="Mã đơn, tên, SĐT..." class="bg-white border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm w-64 outline-none focus:border-kn-blue shadow-sm">
        </div>

        <!-- BỘ LỌC NGÀY THÁNG NĂM -->
        <div class="relative" title="Lọc theo ngày đặt hàng">
            <input id="dateFilter" type="date" class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 outline-none focus:border-kn-blue shadow-sm cursor-pointer">
        </div>
        
        <!-- LỌC TRẠNG THÁI -->
        <select id="statusFilter" class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm font-bold outline-none focus:border-kn-blue shadow-sm cursor-pointer">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chờ xử lý</option>
            <option value="confirmed">Đã xác nhận</option>
            <option value="processing">Đang xử lý</option>
            <option value="shipped">Đang giao</option>
            <option value="delivered">Đã giao</option>
            <option value="cancelled">Đã hủy</option>
        </select>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full min-w-[1050px] text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="p-4 text-center text-[11px] uppercase font-black text-gray-500 w-12">#</th>
                                    <th class="p-4 text-[11px] uppercase font-black text-gray-500 whitespace-nowrap">Mã đơn</th>
                                    <th class="p-4 text-[11px] uppercase font-black text-gray-500 w-[35%]">Khách hàng</th>
                                    <th class="p-4 text-[11px] uppercase font-black text-gray-500 whitespace-nowrap">Ngày đặt</th>
                                    <th class="p-4 text-right text-[11px] uppercase font-black text-gray-500 whitespace-nowrap">Tổng tiền</th>
                                    <th class="p-4 text-center text-[11px] uppercase font-black text-gray-500 whitespace-nowrap">Trạng thái</th>
                                    <th class="p-4 text-right text-[11px] uppercase font-black text-gray-500 whitespace-nowrap">Thao tác</th>
                                </tr>
                            </thead>
      <tbody id="orderTableBody" class="divide-y divide-gray-100"><tr><td colspan="7" class="p-12 text-center text-gray-400">Đang tải đơn hàng...</td></tr></tbody>
    </table>
  </div>
  <div id="paginationContainer" class="px-6 py-4 border-t border-gray-200 flex justify-end"></div>
</section>

</div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/common/supabase.js"></script>
<script src="../assets/js/common/utils.js"></script>
<script src="../assets/js/admin/admin-core.js"></script>
<script src="../assets/js/admin/admin-nav.js"></script>
<script src="../assets/js/admin/admin-orders.js"></script>
</body>
</html>
