<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh mục vật tư công nghiệp | MRO Khang Nam</title>

    <meta
        name="description"
        content="MRO Khang Nam cung cấp danh mục vật tư công nghiệp, linh kiện thay thế và thiết bị bảo trì chính hãng cho doanh nghiệp."
    >

    <meta name="robots" content="index,follow">

    <!-- Open Graph -->
    <meta
        property="og:title"
        content="Danh mục vật tư công nghiệp | MRO Khang Nam"
    >

    <meta
        property="og:description"
        content="Khám phá hệ thống danh mục vật tư công nghiệp chính hãng tại MRO Khang Nam."
    >

    <meta
        property="og:image"
        content="../assets/banner-brands.webp"
    >

    <link
        rel="icon"
        type="image/png"
        href="../assets/images/world mark.png"
    >

    <!-- CSS DÙNG CHUNG -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/header.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/footer.css"
    >

    <!-- CSS CATALOG DÙNG CHUNG:
         Products / Category / Subcategory / Family -->
    <link
        rel="stylesheet"
        href="../assets/css/catalog.css"
    >
</head>


<body class="catalog-page">

    <!-- HEADER -->
    <div
        id="app-header"
        class="site-header-placeholder"
    ></div>


    <!-- ====================================================
         PAGE HERO
    ===================================================== -->

    <section class="catalog-hero">

        <div class="catalog-hero-overlay"></div>

        <div class="catalog-hero-container">

            <!-- BREADCRUMB -->

            <nav
                class="catalog-breadcrumb"
                aria-label="Breadcrumb"
            >

                <a
                    href="../index.html"
                    class="catalog-breadcrumb-link"
                >
                    Trang chủ
                </a>

                <span
                    class="catalog-breadcrumb-separator"
                    aria-hidden="true"
                >
                    /
                </span>

                <span
                    class="catalog-breadcrumb-current"
                >
                    Tất Cả Danh Mục
                </span>

            </nav>


            <!-- HERO CONTENT -->

            <div class="catalog-hero-content">

                <h1 class="catalog-hero-title">
                    Danh Mục Vật Tư MRO
                </h1>

                <p class="catalog-hero-description">
                    Khám phá hệ thống hàng ngàn sản phẩm vật tư công nghiệp,
                    linh kiện thay thế và thiết bị bảo trì chính hãng.
                </p>

            </div>

        </div>

    </section>


    <!-- ====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="catalog-main">

        <div class="catalog-container">


            <!-- SECTION HEADER -->

            <div class="catalog-section-header">

                <div class="catalog-section-heading">

                    <span class="catalog-section-eyebrow">
                    </span>

                    <h2 class="catalog-section-title">
                    </h2>

                    <p class="catalog-section-description">
                    </p>

                </div>


                <!-- THỐNG KÊ -->
                <div
                    class="catalog-counter"
                    aria-label="Thống kê danh mục và sản phẩm"
                >

                    <span
                        id="totalCategoriesCount"
                        class="catalog-counter-number"
                    >
                        --
                    </span>

                    <span>
                        danh mục
                    </span>

                    <span
                        class="catalog-counter-separator"
                        aria-hidden="true"
                    >
                        ·
                    </span>

                    <span
                        id="totalProductsCount"
                        class="catalog-counter-number"
                    >
                        --
                    </span>

                    <span>
                        sản phẩm
                    </span>

                </div>

            </div>


            <!-- ==================================================
                 LOADING SKELETON
            =================================================== -->

            <div
                id="skeletonLoading"
                class="catalog-grid catalog-category-grid"
            >

                <div class="catalog-category-skeleton">
                    <div class="catalog-skeleton-icon"></div>
                    <div class="catalog-skeleton-title"></div>
                </div>

                <div class="catalog-category-skeleton">
                    <div class="catalog-skeleton-icon"></div>
                    <div class="catalog-skeleton-title"></div>
                </div>

                <div class="catalog-category-skeleton">
                    <div class="catalog-skeleton-icon"></div>
                    <div class="catalog-skeleton-title"></div>
                </div>

                <div class="catalog-category-skeleton">
                    <div class="catalog-skeleton-icon"></div>
                    <div class="catalog-skeleton-title"></div>
                </div>

            </div>


            <!-- ==================================================
                 CATEGORY GRID
            =================================================== -->

            <div
                id="categoryGrid"
                class="catalog-grid catalog-category-grid is-hidden"
            ></div>


            <!-- ==================================================
                 EMPTY STATE
            =================================================== -->

            <div
                id="emptyState"
                class="catalog-empty-state is-hidden"
            >

                <svg
                    class="catalog-empty-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"
                    ></path>
                </svg>

                <h2 class="catalog-empty-title">
                    Thư mục trống
                </h2>

                <p class="catalog-empty-description">
                    Hệ thống đang cập nhật dữ liệu danh mục vật tư.
                </p>

                <a
                    href="products.html"
                    class="catalog-empty-button"
                >
                    &larr; Quay lại Kho hàng
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <div id="app-footer"></div>


    <!-- ====================================================
         JAVASCRIPT
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <script src="../assets/components/header.js"></script>
    <script src="../assets/components/footer.js"></script>

    <script src="../assets/js/users/auth-ui.js"></script>
    <script src="../assets/js/users/category.js"></script>

</body>

</html>
