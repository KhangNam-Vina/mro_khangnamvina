<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu - MRO Khang Nam</title>

    <meta
        name="description"
        content="Khôi phục mật khẩu tài khoản đối tác B2B MRO Khang Nam."
    >

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS CHUNG -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- CSS AUTH -->
    <link
        rel="stylesheet"
        href="../assets/css/auth.css"
    >
</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo-wrapper">

            <a
                href="../index.html"
                class="auth-logo-link"
                aria-label="MRO Khang Nam - Trang chủ"
            >

                <img
                    src="../assets/images/world mark.png"
                    alt="MRO Khang Nam Logo"
                    class="auth-logo"
                >

            </a>

        </div>


        <!-- TITLE -->
        <h1 class="auth-title">
            Quên Mật Khẩu
        </h1>

        <p class="auth-description">
            Nhập email doanh nghiệp để nhận liên kết khôi phục mật khẩu
        </p>


        <!-- FORM -->
        <form
            id="forgotPasswordForm"
            class="auth-form"
        >

            <!-- EMAIL -->
            <div class="auth-field">

                <label
                    for="email"
                    class="auth-label"
                >
                    Email doanh nghiệp
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                    placeholder="purchasing@company.com"
                    class="auth-input"
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                id="submitBtn"
                class="auth-submit"
            >
                Gửi Link Khôi Phục
            </button>

        </form>


        <!-- BACK TO LOGIN -->
        <div class="auth-footer">

            <span>
                Nhớ lại mật khẩu?
            </span>

            <a href="login.html">
                Quay lại Đăng nhập
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <script src="../assets/js/users/forgot-password.js"></script>

</body>

</html>
