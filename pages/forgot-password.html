<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
</head>
<body class="bg-kn-light flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-4 border-kn-orange">
        
        <!-- LOGO -->
        <div class="flex justify-center mb-6">
            <a href="../index.html">
                <img src="../assets/world mark.png" alt="MRO Khang Nam Logo" class="h-12 w-auto object-contain">
            </a>
        </div>

        <h2 class="text-2xl font-black text-kn-blue text-center mb-2 uppercase">Quên mật khẩu?</h2>
        <p class="text-sm text-gray-500 text-center mb-8">Đừng lo! Nhập email của bạn vào bên dưới, chúng tôi sẽ gửi link đặt lại mật khẩu an toàn.</p>

        <!-- FORM QUÊN MẬT KHẨU -->
        <form id="forgotPasswordForm" onsubmit="handleResetPassword(event)">
            
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Địa chỉ Email <span class="text-red-500">*</span></label>
                <input type="email" id="email" required placeholder="Nhập email bạn đã đăng ký..." class="w-full border-2 border-gray-200 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-kn-blue transition-colors">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-kn-blue text-white font-bold py-3 px-4 rounded-md hover:bg-kn-dark shadow-md transition-colors uppercase">
                Gửi Link Khôi Phục
            </button>
        </form>

        <div class="mt-6 text-center text-sm font-medium">
            <span class="text-gray-500">Nhớ ra mật khẩu rồi?</span> 
            <a href="login.html" class="text-kn-orange hover:underline font-bold">Quay lại Đăng nhập</a>
        </div>
    </div>

    <!-- SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wnhrkziiujbswnrfnlly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mCpQQA5h6TQHP7ueyYv1qg_vxnTQIRk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleResetPassword(e) {
            e.preventDefault(); // Chặn tải lại trang
            
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!email) return;

            // Hiệu ứng nút bấm
            btn.innerHTML = 'Đang gửi link mây...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // Lệnh gửi email khôi phục của Supabase
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    // Dẫn khách về trang đặt lại mật khẩu sau khi họ bấm link trong mail
                    redirectTo: window.location.origin + '/pages/reset-password.html',
                });

                if (error) throw error;

                alert("Ngon lành! Supabase đã bắn một link khôi phục vào email của bạn. Nhớ check cả hộp thư rác (Spam) nhé!");
                
                // Reset form
                document.getElementById('forgotPasswordForm').reset();

            } catch (error) {
                console.error("Lỗi:", error.message);
                alert("Lỗi: " + error.message);
            } finally {
                // Trả lại trạng thái nút ban đầu
                btn.innerHTML = 'Gửi Link Khôi Phục';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
