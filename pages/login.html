<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MRO Khang Nam</title>
    <meta name="description" content="Đăng nhập tài khoản đối tác B2B MRO Khang Nam.">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS CHUNG -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- CSS AUTH -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body class="auth-page">
    <main class="auth-container">
        <!-- LOGO -->
        <div class="auth-logo-wrapper">
            <a href="../index.html" class="auth-logo-link" aria-label="MRO Khang Nam - Trang chủ">
                <img src="../assets/images/world mark.png" alt="MRO Khang Nam Logo" class="auth-logo">
            </a>
        </div>

        <!-- TITLE -->
        <h1 class="auth-title">Đăng Nhập B2B</h1>
        <p class="auth-description">Vui lòng nhập email doanh nghiệp để tiếp tục</p>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="loginForm" class="auth-form">

            <!-- HỘP THÔNG BÁO LỖI (MỚI THÊM) -->
            <div id="loginErrorMessage" class="is-hidden" style="margin-bottom: 20px; padding: 12px 16px; border-radius: 8px; background-color: #fef2f2; border: 1px solid #f87171; color: #b91c1c; font-size: 13px; font-weight: 600; line-height: 1.5; display: flex; align-items: flex-start; gap: 8px;">
                <svg style="width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span id="loginErrorText">Lỗi đăng nhập!</span>
            </div>

            <!-- EMAIL -->
            <div class="auth-field">
                <label for="email" class="auth-label">
                    Email / Tài khoản
                    <span class="auth-required">*</span>
                </label>
                <input type="email" id="email" required autocomplete="email" placeholder="purchasing@company.com" class="auth-input">
            </div>

            <!-- PASSWORD -->
            <div class="auth-field">
                <div class="auth-forgot">
                    <label for="password" class="auth-label">
                        Mật khẩu
                        <span class="auth-required">*</span>
                    </label>
                    <a href="forgot-password.html">Quên mật khẩu?</a>
                </div>
                <input type="password" id="password" required autocomplete="current-password" placeholder="Nhập mật khẩu..." class="auth-input">
            </div>

            <!-- REMEMBER -->
            <label for="remember" class="auth-remember">
                <input type="checkbox" id="remember" checked>
                <span>Ghi nhớ đăng nhập</span>
            </label>

            <!-- SUBMIT -->
            <button type="submit" id="btnLoginSubmit" class="auth-submit">
                Đăng Nhập
            </button>
        </form>

        <!-- ĐƯỜNG KẺ -->
        <div class="auth-divider">
            <span class="auth-divider-line"></span>
            <span class="auth-divider-text">Hoặc</span>
            <span class="auth-divider-line"></span>
        </div>

        <!-- REGISTER -->
        <div class="auth-footer">
            <span>Chưa có tài khoản?</span>
            <a href="register.html">Đăng ký mở tài khoản</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>
    <script src="../assets/js/users/login.js"></script>
</body>
</html>
