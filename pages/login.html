<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - MRO Khang Nam</title>

    <meta
        name="description"
        content="Đăng nhập tài khoản đối tác B2B MRO Khang Nam."
    >

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS CHUNG -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- CSS AUTH -->
    <link
        rel="stylesheet"
        href="../assets/css/auth.css"
    >
</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo-wrapper">
            <a
                href="../index.html"
                class="auth-logo-link"
                aria-label="MRO Khang Nam - Trang chủ"
            >
                <img
                    src="../assets/images/world mark.png"
                    alt="MRO Khang Nam Logo"
                    class="auth-logo"
                >
            </a>
        </div>


        <!-- TITLE -->
        <h1 class="auth-title">
            Đăng Nhập B2B
        </h1>

        <p class="auth-description">
            Vui lòng nhập email doanh nghiệp để tiếp tục
        </p>


        <!-- FORM ĐĂNG NHẬP -->
        <form
            id="loginForm"
            class="auth-form"
        >

            <!-- EMAIL -->
            <div class="auth-field">

                <label
                    for="email"
                    class="auth-label"
                >
                    Email / Tài khoản
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                    placeholder="purchasing@company.com"
                    class="auth-input"
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-field">

                <div class="auth-forgot">

                    <label
                        for="password"
                        class="auth-label"
                    >
                        Mật khẩu
                        <span class="auth-required">*</span>
                    </label>

                    <a
                        href="forgot-password.html"
                    >
                        Quên mật khẩu?
                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                    placeholder="Nhập mật khẩu..."
                    class="auth-input"
                >

            </div>


            <!-- REMEMBER -->
            <label
                for="remember"
                class="auth-remember"
            >

                <input
                    type="checkbox"
                    id="remember"
                    checked
                >

                <span>
                    Ghi nhớ đăng nhập
                </span>

            </label>


            <!-- SUBMIT -->
            <button
                type="submit"
                id="btnLoginSubmit"
                class="auth-submit"
            >
                Đăng Nhập
            </button>

        </form>


        <!-- ĐƯỜNG KẺ -->
        <div class="auth-divider">

            <span class="auth-divider-line"></span>

            <span class="auth-divider-text">
                Hoặc
            </span>

            <span class="auth-divider-line"></span>

        </div>


        <!-- REGISTER -->
        <div class="auth-footer">

            <span>
                Chưa có tài khoản?
            </span>

            <a href="register.html">
                Đăng ký mở tài khoản
            </a>

        </div>

    </main>




    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <script src="../assets/js/users/login.js"></script>

</body>

</html>
