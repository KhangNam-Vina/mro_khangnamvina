<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
    <style>
        /* Tùy chỉnh thanh cuộn cho Sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #00479b; /* Màu xanh kn-blue */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #ff5e00; /* Màu cam kn-orange */
        }
    </style>
</head>
<body class="bg-kn-light flex flex-col min-h-screen">

    <!-- CHỖ NÀY ĐỂ RÁP HEADER BẰNG JAVASCRIPT -->
    <div id="app-header"></div>

    <main class="flex-grow container mx-auto px-4 py-10">
        <!-- BREADCRUMB
        <div class="text-sm font-medium mb-6 text-gray-500">
            <a href="../index.html" class="hover:text-kn-orange">Home</a> / 
            <span class="text-kn-blue font-bold uppercase">Tất Cả Sản Phẩm</span>
        </div> -->

        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- CỘT TRÁI: SIDEBAR LỌC SẢN PHẨM (Ráp bằng JS) -->
            <aside class="lg:w-1/4 shrink-0" id="app-sidebar"></aside>

            <!-- CỘT PHẢI: LƯỚI SẢN PHẨM (Khu vực cũ của ông) -->
            <section class="lg:w-3/4 flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <h1 id="pageTitle" class="text-2xl font-bold text-kn-blue uppercase">Danh sách sản phẩm</h1>
                    <!-- <select class="border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-kn-orange text-gray-600">
                        <option>Mới nhất</option>
                        <option>Giá tăng dần</option>
                        <option>Giá giảm dần</option>
                    </select> -->
                </div>

                <!-- BÃI ĐÁP SẢN PHẨM -->
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Dữ liệu sản phẩm sẽ được Javascript nhét vào đây giống y như cũ -->
                </div>

                <!-- Phân trang -->
                <div id="paginationContainer" class="mt-10 flex justify-center space-x-2"></div>
            </section>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- PHẦN GỌI SCRIPT ĐƯỢC QUY HOẠCH GỌN GÀNG LẠI -->
    <!-- ========================================== -->

    <!-- 1. GỌI SCRIPT COMPONENT HEADER/FOOTER -->
    <script src="../assets/components/header.js"></script>
    <script src="../assets/components/footer.js"></script>
    <script src="../assets/components/sidebar.js"></script>

    <!-- 2. GỌI THƯ VIỆN & SCRIPT DÙNG CHUNG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common.js"></script>

    <!-- 3. SCRIPT LOGIC RIÊNG CỦA TRANG NÀY (CỰC SẠCH) -->
    <script src="../assets/js/promotions.js"></script>
</body>
</html>
