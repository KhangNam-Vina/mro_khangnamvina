<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Thương hiệu vật tư công nghiệp | MRO Khang Nam</title>

    <meta
        name="description"
        content="MRO Khang Nam phân phối hơn 100 thương hiệu vật tư công nghiệp chính hãng như SKF, Bosch, Makita..."
    >

    <meta name="robots" content="index,follow">

    <!-- Open Graph -->
    <meta
        property="og:title"
        content="Thương hiệu vật tư công nghiệp | MRO Khang Nam"
    >

    <meta
        property="og:description"
        content="MRO Khang Nam phân phối hơn 100 thương hiệu vật tư công nghiệp chính hãng như SKF, Bosch, Makita..."
    >

    <meta
        property="og:image"
        content="../assets/banner-brands.webp"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="../assets/images/world mark.png"
    >

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/blog.css">
</head>

<body class="blog-page">

    <!-- HEADER -->
    <div id="app-header"></div>


    <!-- HERO -->
    <section class="blog-hero">

        <div class="blog-hero-overlay"></div>

        <div class="blog-hero-container">

            <nav
                class="blog-breadcrumb"
                aria-label="Breadcrumb"
            >
                <a
                    href="../index.html"
                    class="blog-breadcrumb-link"
                >
                    Trang chủ
                </a>

                <span class="blog-breadcrumb-separator">
                    /
                </span>

                <span class="blog-breadcrumb-current">
                    Bài viết
                </span>
            </nav>

            <h1 class="blog-hero-title">
                Trung Tâm Kiến Thức MRO
            </h1>

            <p class="blog-hero-description">
                Nghiên cứu xu hướng sản xuất, cẩm nang bảo trì dự đoán
                và hướng dẫn lựa chọn vật tư công nghiệp tối ưu nhất
                cho nhà máy của bạn.
            </p>

        </div>

    </section>


    <!-- MAIN -->
    <main class="blog-main">

        <div class="blog-layout">

            <!-- ==========================================
                 BLOG CONTENT
                 ========================================== -->
            <section class="blog-content">

                <!-- CATEGORY FILTER -->
                <div class="blog-filter-bar">

                    <div
                        id="categoryFilters"
                        class="blog-category-filters"
                    >

                        <button
                            type="button"
                            onclick="filterBlog('ALL', this)"
                            data-cat="ALL"
                            class="cat-btn blog-category-btn is-active"
                        >
                            Tất cả
                        </button>

                        <button
                            type="button"
                            onclick="filterBlog('bảo trì', this)"
                            data-cat="bảo trì"
                            class="cat-btn blog-category-btn"
                        >
                            Bảo trì
                        </button>

                        <button
                            type="button"
                            onclick="filterBlog('vật tư', this)"
                            data-cat="vật tư"
                            class="cat-btn blog-category-btn"
                        >
                            Vật tư
                        </button>

                        <button
                            type="button"
                            onclick="filterBlog('an toàn', this)"
                            data-cat="an toàn"
                            class="cat-btn blog-category-btn"
                        >
                            An toàn (Safety)
                        </button>

                    </div>

                    <span
                        id="blogCount"
                        class="blog-count"
                    >
                        ... bài viết
                    </span>

                </div>


                <!-- BLOG DATA AREA -->
                <div id="blogContainer">

                    <!-- SKELETON -->
                    <div
                        id="skeletonLoading"
                        class="blog-skeleton-container"
                    >

                        <div class="blog-skeleton-featured"></div>

                        <div class="blog-skeleton-grid">

                            <div class="blog-skeleton-card"></div>
                            <div class="blog-skeleton-card"></div>

                        </div>

                    </div>


                    <!-- FEATURED POST -->
                    <div
                        id="featuredPostArea"
                        class="blog-featured-area"
                    ></div>


                    <!-- BLOG GRID -->
                    <div
                        id="blogGrid"
                        class="blog-grid"
                    ></div>


                    <!-- PAGINATION -->
                    <div
                        id="paginationContainer"
                        class="blog-pagination"
                    ></div>


                    <!-- EMPTY STATE -->
                    <div
                        id="emptyState"
                        class="blog-empty"
                    >

                        <svg
                            class="blog-empty-icon"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                            ></path>
                        </svg>

                        <h3 class="blog-empty-title">
                            Không tìm thấy bài viết!
                        </h3>

                    </div>

                </div>

            </section>


            <!-- ==========================================
                 SIDEBAR
                 ========================================== -->
            <aside class="blog-sidebar">

                <!-- SEARCH -->
                <div class="blog-sidebar-card">

                    <h3 class="blog-sidebar-title">

                        <svg
                            class="blog-sidebar-title-icon"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                            ></path>
                        </svg>

                        Tìm Bài Viết

                    </h3>


                    <div class="blog-search-box">

                        <input
                            type="text"
                            id="blogSearchInput"
                            placeholder="Nhập từ khóa..."
                            class="blog-search-input"
                        >

                        <button
                            type="button"
                            onclick="handleSearch()"
                            class="blog-search-button"
                            aria-label="Tìm kiếm"
                        >

                            <svg
                                class="blog-search-button-icon"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                ></path>
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- LATEST BLOG -->
                <div class="blog-sidebar-card">

                    <h3 class="blog-sidebar-title">

                        <svg
                            class="blog-sidebar-title-icon"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                            ></path>
                        </svg>

                        Bài Viết Mới Nhất

                    </h3>


                    <div
                        id="sidebarBlogList"
                        class="blog-sidebar-list"
                    >

                        <div class="blog-sidebar-skeleton">

                            <div class="blog-sidebar-skeleton-image"></div>

                            <div class="blog-sidebar-skeleton-content">

                                <div class="blog-sidebar-skeleton-line"></div>

                                <div class="blog-sidebar-skeleton-line short"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </aside>

        </div>

    </main>


    <!-- FOOTER -->
    <div id="app-footer"></div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- COMMON JS -->
    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <!-- COMPONENTS -->
    <script src="../assets/components/header.js"></script>
    <script src="../assets/components/footer.js"></script>

    <!-- USER -->
    <script src="../assets/js/users/auth-ui.js"></script>

    <!-- PAGE -->
    <script src="../assets/js/users/blog.js"></script>

</body>
</html>
