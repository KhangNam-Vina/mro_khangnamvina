<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký Tài khoản Khách hàng - MRO Khang Nam</title>

    <meta
        name="description"
        content="Đăng ký tài khoản đối tác B2B MRO Khang Nam."
    >

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS CHUNG -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- CSS AUTH -->
    <link
        rel="stylesheet"
        href="../assets/css/auth.css"
    >
</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo-wrapper">

            <a
                href="../index.html"
                class="auth-logo-link"
                aria-label="MRO Khang Nam - Trang chủ"
            >

                <img
                    src="../assets/images/world mark.png"
                    alt="MRO Khang Nam Logo"
                    class="auth-logo"
                >

            </a>

        </div>


        <!-- TITLE -->
        <h1 class="auth-title">
            Mở Tài Khoản
        </h1>

        <p class="auth-description">
            Đăng ký tài khoản đối tác B2B của MRO Khang Nam
        </p>


        <!-- FORM ĐĂNG KÝ -->
        <form
            id="registerForm"
            class="auth-form"
        >

            <!-- EMAIL -->
            <div class="auth-field">

                <label
                    for="email"
                    class="auth-label"
                >
                    Email doanh nghiệp
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                    placeholder="purchasing@company.com"
                    class="auth-input"
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-field">

                <label
                    for="password"
                    class="auth-label"
                >
                    Mật khẩu
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Tạo mật khẩu (ít nhất 6 ký tự)..."
                    class="auth-input"
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="auth-field">

                <label
                    for="confirmPassword"
                    class="auth-label"
                >
                    Xác nhận mật khẩu
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Nhập lại mật khẩu..."
                    class="auth-input"
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                id="registerBtn"
                class="auth-submit"
            >
                Tạo Tài Khoản
            </button>

        </form>


        <!-- ĐƯỜNG KẺ -->
        <div class="auth-divider">

            <span class="auth-divider-line"></span>

            <span class="auth-divider-text">
                Hoặc
            </span>

            <span class="auth-divider-line"></span>

        </div>


        <!-- LOGIN -->
        <div class="auth-footer">

            <span>
                Đã có tài khoản?
            </span>

            <a href="login.html">
                Đăng nhập ngay
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <script src="../assets/js/users/register.js"></script>

</body>

</html>
