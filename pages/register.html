<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản Khách hàng - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
</head>
<body class="bg-kn-light font-sans h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-kn-blue mb-2">MRO KHANG NAM</h1>
            <p class="text-gray-500 text-sm">Đăng ký tài khoản đối tác B2B</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Email doanh nghiệp</label>
                <input type="email" id="email" placeholder="purchasing@company.com" class="w-full border border-gray-300 rounded px-4 py-2.5 focus:border-kn-blue focus:ring-1 focus:ring-kn-blue outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="password" placeholder="Tạo mật khẩu (ít nhất 6 ký tự)" class="w-full border border-gray-300 rounded px-4 py-2.5 focus:border-kn-blue focus:ring-1 focus:ring-kn-blue outline-none" required>
            </div>
            
            <button type="submit" id="registerBtn" class="w-full bg-kn-blue text-white font-bold py-3 rounded hover:bg-blue-800 transition shadow-md mt-4">
                Tạo Tài Khoản
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Đã có tài khoản? <a href="login.html" class="text-kn-orange font-bold hover:underline">Đăng nhập ngay</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wnhrkziiujbswnrfnlly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mCpQQA5h6TQHP7ueyYv1qg_vxnTQIRk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('registerBtn');

            if (password.length < 6) {
                alert("Mật khẩu phải từ 6 ký tự trở lên nha ní!");
                return;
            }

            btn.innerHTML = 'Đang xử lý...';
            btn.disabled = true;

            try {
                // Hàm tạo tài khoản mới của Supabase
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // alert("Đỉnh! Tạo tài khoản thành công. Giờ ní đăng nhập thử nha.");
                window.location.href = "login.html"; // Đá qua trang login
                
            } catch (error) {
                alert("Lỗi rồi: " + error.message);
                btn.innerHTML = 'Tạo Tài Khoản';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
