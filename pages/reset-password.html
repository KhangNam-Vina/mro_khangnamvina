<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu - MRO Khang Nam</title>

    <meta
        name="description"
        content="Đặt lại mật khẩu tài khoản đối tác B2B MRO Khang Nam."
    >

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS CHUNG -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- CSS AUTH -->
    <link
        rel="stylesheet"
        href="../assets/css/auth.css"
    >
</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo-wrapper">

            <a
                href="../index.html"
                class="auth-logo-link"
                aria-label="MRO Khang Nam - Trang chủ"
            >

                <img
                    src="../assets/images/world mark.png"
                    alt="MRO Khang Nam Logo"
                    class="auth-logo"
                >

            </a>

        </div>


        <!-- TITLE -->
        <h1 class="auth-title">
            Đặt Lại Mật Khẩu
        </h1>

        <p class="auth-description">
            Nhập mật khẩu mới cho tài khoản của bạn
        </p>


        <!-- FORM -->
        <form
            id="resetPasswordForm"
            class="auth-form"
        >

            <!-- PASSWORD -->
            <div class="auth-field">

                <label
                    for="newPassword"
                    class="auth-label"
                >
                    Mật khẩu mới
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="password"
                    id="newPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Nhập mật khẩu mới..."
                    class="auth-input"
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="auth-field">

                <label
                    for="confirmPassword"
                    class="auth-label"
                >
                    Xác nhận mật khẩu
                    <span class="auth-required">*</span>
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Nhập lại mật khẩu mới..."
                    class="auth-input"
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                id="resetPasswordBtn"
                class="auth-submit"
            >
                Cập Nhật Mật Khẩu
            </button>

        </form>


        <!-- BACK TO LOGIN -->
        <div class="auth-footer">

            <span>
                Đã nhớ mật khẩu?
            </span>

            <a href="login.html">
                Quay lại Đăng nhập
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/common/supabase.js"></script>
    <script src="../assets/js/common/utils.js"></script>
    <script src="../assets/js/common/auth.js"></script>

    <script src="../assets/js/users/reset-password.js"></script>

</body>

</html>
