<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8' } } } }
    </script>
</head>
<body class="bg-kn-light flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-4 border-kn-blue">
        
        <!-- LOGO -->
        <div class="flex justify-center mb-6">
            <a href="../index.html">
                <img src="../assets/world mark.png" alt="MRO Khang Nam Logo" class="h-12 w-auto object-contain">
            </a>
        </div>

        <h2 class="text-2xl font-black text-kn-blue text-center mb-2 uppercase">Thiết Lập Lại</h2>
        <p class="text-sm text-gray-500 text-center mb-8">Vui lòng nhập mật khẩu mới của bạn bên dưới. Nhớ chọn mật khẩu dễ nhớ nhé!</p>

        <!-- FORM ĐẶT LẠI MẬT KHẨU -->
        <form id="resetPasswordForm" onsubmit="updatePassword(event)">
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Mật khẩu mới <span class="text-red-500">*</span></label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự..." class="w-full border-2 border-gray-200 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-kn-blue transition-colors">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-700 mb-2">Xác nhận mật khẩu <span class="text-red-500">*</span></label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Nhập lại mật khẩu mới..." class="w-full border-2 border-gray-200 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-kn-blue transition-colors">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-kn-orange text-white font-bold py-3 px-4 rounded-md hover:bg-orange-600 shadow-md transition-colors uppercase">
                Lưu Mật Khẩu & Đăng Nhập
            </button>
        </form>
    </div>

    <!-- SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wnhrkziiujbswnrfnlly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mCpQQA5h6TQHP7ueyYv1qg_vxnTQIRk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Chặn không cho khách tự ý vào trang này nếu không có phiên làm việc (Session) từ link Email
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Đường dẫn này đã hết hạn hoặc không hợp lệ. Vui lòng yêu cầu lại link mới!");
                window.location.href = "forgot-password.html";
            }
        };

        async function updatePassword(e) {
            e.preventDefault(); 
            
            const pwd1 = document.getElementById('newPassword').value;
            const pwd2 = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            // Logic kiểm tra 2 cục password có đá nhau không
            if (pwd1 !== pwd2) {
                alert("Hai mật khẩu không khớp nhau, ní gõ lại từ từ thôi nhé!");
                return;
            }

            btn.innerHTML = 'Đang khóa mật khẩu...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // Lệnh đổi mật khẩu siêu cấp của Supabase (Chỉ dùng được khi khách đang có Session)
                const { error } = await supabaseClient.auth.updateUser({
                    password: pwd1
                });

                if (error) throw error;

                // alert("Chúc mừng! Đổi mật khẩu thành công. Hệ thống sẽ đưa bạn về trang Đăng nhập.");
                
                // Supabase tự động log out khách sau khi đổi pass để bảo mật, nên mình đá khách về trang Login
                await supabaseClient.auth.signOut();
                window.location.href = 'login.html';

            } catch (error) {
                console.error("Lỗi:", error.message);
                alert("Cập nhật thất bại: " + error.message);
                
                btn.innerHTML = 'Lưu Mật Khẩu & Đăng Nhập';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
