<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Vật Tư & Gửi RFQ - MRO Khang Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'kn-blue': '#00479b', 'kn-orange': '#ff5e00', 'kn-light': '#f5f6f8', 'kn-dark': '#003370' } } } }
    </script>
</head>
<body class="bg-kn-light font-sans text-gray-800 flex flex-col min-h-screen">

    <!-- CHỖ NÀY ĐỂ RÁP HEADER BẰNG JAVASCRIPT -->
    <div id="app-header"></div>

    <!-- 3. PAGE HEADER / BANNER -->
    <div class="bg-gray-900 text-white py-12 relative overflow-hidden">
        <img src="../assets/world mark.png" alt="Brands Banner" class="absolute inset-0 w-full h-full object-cover opacity-20">
        <div class="container mx-auto px-4 relative z-10">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">Trung Tâm Tra Cứu Vật Tư & Báo Giá.</h1>
            <p class="text-gray-300 max-w-2xl text-sm leading-relaxed">
                Chọn sản phẩm công nghiệp trực tiếp từ kho Supabase và gửi yêu cầu RFQ nhanh chóng.
            </p>
        </div>
    </div>
 
    <main class="container mx-auto px-4 py-10 flex-grow">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-kn-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Danh sách sản phẩm trong kho hiện tại
                    </h2>

                    <div id="productLoading" class="text-center py-10 text-gray-400">
                        <div class="inline-block w-6 h-6 border-2 border-kn-blue border-t-transparent rounded-full animate-spin mb-2"></div>
                        <p class="text-xs">Đang bốc sản phẩm từ Supabase...</p>
                    </div>

                    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 sticky top-24">
                    <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 uppercase tracking-wider">Thông tin gửi đơn</h2>
                    
                    <form id="rfqForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Tên Công ty / Nhà máy *</label>
                            <input type="text" id="company" placeholder="VD: Nhà máy nhựa Thủ Đức..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-kn-blue outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Người liên hệ (Purchasing) *</label>
                            <input type="text" id="name" placeholder="Họ và tên..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-kn-blue outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Số điện thoại / Zalo *</label>
                            <input type="tel" id="phone" placeholder="0909 xxx xxx" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-kn-blue outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Email nhận báo giá *</label>
                            <input type="email" id="email" placeholder="purchasing@factory.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-kn-blue outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Ghi chú giao hàng</label>
                            <textarea id="notes" rows="2" placeholder="Yêu cầu chứng chỉ CO/CQ hoặc thời gian giao..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-kn-blue outline-none resize-none"></textarea>
                        </div>

                        <button type="button" id="submitRfqBtn" onclick="submitRFQ()" class="w-full mt-4 bg-kn-orange text-white font-bold py-3 px-4 rounded hover:bg-orange-600 transition shadow flex justify-center items-center text-sm">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                            Gửi Yêu Cầu Báo Giá Real-time
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- CHỖ NÀY ĐỂ RÁP FOOTER BẰNG JAVASCRIPT -->
    <div id="app-footer"></div>

    <!-- ========================================== -->
    <!-- PHẦN GỌI SCRIPT ĐƯỢC QUY HOẠCH GỌN GÀNG LẠI -->
    <!-- ========================================== -->

    <!-- 1. GỌI SCRIPT COMPONENT HEADER/FOOTER -->
    <script src="../assets/components/header.js"></script>
    <script src="../assets/components/footer.js"></script>

    <!-- 2. GỌI THƯ VIỆN & SCRIPT DÙNG CHUNG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/common.js"></script>

    <!-- 3. SCRIPT LOGIC RIÊNG CỦA TRANG NÀY (CỰC SẠCH) -->
    <script src="../assets/js/rfq.js"></script>
</body>
</html>
